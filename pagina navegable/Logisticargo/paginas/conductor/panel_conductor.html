<!-- ==========================================================
       CONDUCTOR - PANEL PRINCIPAL (MI RUTA)
       Muestra la ruta y las paradas del día para el conductor.

       EDITAR ESTA SECCIÓN:
       Estilos:    css/componentes.css, css/botones.css
       JavaScript: javascript/aplicacion.js
       ========================================================== -->
  <!-- MI RUTA -->
  <div x-show="$store.app.page==='dash_conductor'" class="flex-1 overflow-y-auto" style="padding:18px;max-width:560px;margin:0 auto;width:100%">
    <p style="font-size:12px;color:#9C8B78;margin-bottom:4px">Hoy, 22 de mayo de 2026</p>
    <h1 style="font-family:'Fraunces',serif;font-size:21px;font-weight:700;color:#FFFFFF;margin-bottom:18px">Tienes 3 paradas hoy</h1>
    <!-- Parada activa -->
    <div style="background:#C1622D;border-radius:18px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden">
      <div style="position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,#FFFFFF0A 1px,transparent 0);background-size:16px 16px;pointer-events:none"></div>
      <p style="font-size:11px;color:#FFE8D8;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:6px;position:relative">Parada actual · 1 de 3</p>
      <h2 style="font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:#FFFFFF;margin-bottom:4px;position:relative">Recoger en origen</h2>
      <p style="font-size:13px;color:#FFE8D8;margin-bottom:14px;position:relative">Calle 85 #15-32, Bogotá · SRV-2026-00847</p>
      <div style="display:flex;gap:10px;position:relative">
        <button style="flex:1;background:#FFFFFF;color:#9C4D22;padding:14px;border-radius:12px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:none" @click="$store.app.page='co_parada'"><span class="material-symbols-outlined">map</span>Ver detalles</button>
        <button style="background:#2C1A0E44;color:#FFFFFF;padding:14px;border-radius:12px;cursor:pointer;border:none;display:flex;align-items:center" @click="$store.app.contactModal=true"><span class="material-symbols-outlined">call</span></button>
      </div>
    </div>
    <!-- Cola -->
    <p style="font-size:11px;color:#9C8B78;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:10px">Siguientes paradas</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
      <div style="background:#1E1108;border:1px solid #5C3D20;border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;opacity:.85">
        <div style="width:30px;height:30px;border-radius:50%;background:#5C3D20;color:#9C8B78;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">2</div>
        <div><p style="font-size:13px;font-weight:600;color:#FFFFFF">Entregar en destino</p><p style="font-size:11.5px;color:#9C8B78">Carrera 7 #12-34, Medellín · SRV-2026-00847</p></div>
      </div>
      <div style="background:#1E1108;border:1px solid #5C3D20;border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;opacity:.55">
        <div style="width:30px;height:30px;border-radius:50%;background:#5C3D20;color:#9C8B78;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">3</div>
        <div><p style="font-size:13px;font-weight:600;color:#FFFFFF">Recoger en origen</p><p style="font-size:11.5px;color:#9C8B78">Av. Suba #112, Bogotá · SRV-2026-00852</p></div>
      </div>
    </div>
    <!-- Acciones -->
    <p style="font-size:11px;color:#9C8B78;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:10px">Acciones rápidas</p>
    <div class="grid grid-cols-2 gap-3">
      <button style="background:#1E1108;border:1px solid #5C3D20;color:#FFFFFF;padding:16px;border-radius:14px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer" @click="$store.app.page='co_checklist'"><span class="material-symbols-outlined" style="color:#5E7A52">checklist</span>Checklist de carga</button>
      <button style="background:#1E1108;border:1px solid #5C3D20;color:#FFFFFF;padding:16px;border-radius:14px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer" @click="$store.app.page='co_incidente'"><span class="material-symbols-outlined" style="color:#C99A3C">report</span>Reportar novedad</button>
    </div>
  </div>
