<!-- ==========================================================
     CONDUCTOR - PANEL PRINCIPAL (MI RUTA)

     HTML de la pantalla principal del conductor: turno, parada
     activa, cola de próximas paradas y accesos rápidos.

     Estilos específicos: css/conductor/panel_conductor.css
     Estilos comunes de Conductor: css/conductor/conductor_comun.css
     Funcionalidad: javascript/aplicacion.js, javascript/enrutador.js
     ========================================================== -->
<div class="conductor-pantalla" x-show="$store.app.page==='dash_conductor'">

  <div class="conductor-header">
    <p class="conductor-header-eyebrow">Hoy, 22 de mayo de 2026</p>
    <h1 class="panel-conductor-titulo">Tienes 3 paradas hoy</h1>
  </div>

  <!-- Parada activa -->
  <div class="panel-conductor-parada-activa">
    <div class="panel-conductor-textura"></div>
    <p class="panel-conductor-eyebrow-clara">Parada actual · 1 de 3</p>
    <h2 class="panel-conductor-titulo-parada">Recoger en origen</h2>
    <p class="panel-conductor-direccion-clara">Calle 85 #15-32, Bogotá · SRV-2026-00847</p>
    <div class="panel-conductor-acciones-parada">
      <button class="panel-conductor-btn-detalles" @click="$store.app.page='co_parada'"><span class="material-symbols-outlined">map</span>Ver detalles</button>
      <button class="panel-conductor-btn-llamar" @click="$store.app.contactModal=true"><span class="material-symbols-outlined">call</span></button>
    </div>
  </div>

  <!-- Cola de próximas paradas -->
  <p class="conductor-seccion-titulo">Siguientes paradas</p>
  <div class="panel-conductor-cola">
    <div class="panel-conductor-item-cola panel-conductor-item-siguiente">
      <div class="conductor-circulo panel-conductor-circulo">2</div>
      <div>
        <p class="panel-conductor-item-titulo">Entregar en destino</p>
        <p class="panel-conductor-item-detalle">Carrera 7 #12-34, Medellín · SRV-2026-00847</p>
      </div>
    </div>
    <div class="panel-conductor-item-cola panel-conductor-item-futura">
      <div class="conductor-circulo panel-conductor-circulo">3</div>
      <div>
        <p class="panel-conductor-item-titulo">Recoger en origen</p>
        <p class="panel-conductor-item-detalle">Av. Suba #112, Bogotá · SRV-2026-00852</p>
      </div>
    </div>
  </div>

  <!-- Acciones rápidas -->
  <p class="conductor-seccion-titulo">Acciones rápidas</p>
  <div class="grid grid-cols-2 gap-3">
    <button class="conductor-accion" @click="$store.app.page='co_checklist'"><span class="material-symbols-outlined panel-conductor-icono-sage">checklist</span>Checklist de carga</button>
    <button class="conductor-accion" @click="$store.app.page='co_incidente'"><span class="material-symbols-outlined panel-conductor-icono-ocre">report</span>Reportar novedad</button>
  </div>

</div>
