<!-- CHECKLIST -->
  <!-- ==========================================================
       CONDUCTOR - SERVICIOS ASIGNADOS (CHECKLIST DE CARGA)
       Lista de tareas que el conductor marca como completadas
       antes de salir con la carga.

       EDITAR ESTA SECCIÓN:
       Estilos:    css/componentes.css
       JavaScript: javascript/aplicacion.js (checklistCarga)
       ========================================================== -->
  <div x-show="$store.app.page==='co_checklist'" x-data="checklistCarga()" class="flex-1 overflow-y-auto" style="padding:18px;max-width:560px;margin:0 auto;width:100%">
    <a @click.prevent="$store.app.page='co_parada'" style="display:flex;align-items:center;gap:6px;color:#9C8B78;font-size:12px;margin-bottom:16px;cursor:pointer"><span class="material-symbols-outlined" style="font-size:16px">arrow_back</span>Volver</a>
    <h1 style="font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:#FFFFFF;margin-bottom:4px">Checklist de carga</h1>
    <p style="font-size:12.5px;color:#9C8B78;margin-bottom:18px">El cliente puede ver tu progreso en su seguimiento.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
      <template x-for="(it,i) in items" :key="i">
        <div @click="it.done=!it.done" style="background:#1E1108;border:1px solid #5C3D20;border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer">
          <div :style="it.done?'background:#5E7A52;border-color:#5E7A52':'background:transparent;border-color:#9C8B78'" style="width:26px;height:26px;border-radius:8px;border:2px solid;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span x-show="it.done" class="material-symbols-outlined" style="font-size:16px;color:#FFF">check</span></div>
          <p :style="it.done?'color:#9C8B78;text-decoration:line-through':'color:#FFFFFF'" style="font-size:14px;font-weight:500" x-text="it.t"></p>
        </div>
      </template>
    </div>
    <button style="background:#C1622D;color:#FFF;width:100%;padding:17px;border-radius:14px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:none" @click="$store.app.page='dash_conductor';$store.app.toast_('Checklist completado y enviado a la oficina')"><span class="material-symbols-outlined">task_alt</span>Marcar parada como completada</button>
  </div>
