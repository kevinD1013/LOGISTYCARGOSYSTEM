  <div x-show="$store.app.page==='ad_asignaciones'" class="flex-1 overflow-y-auto p-6">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div><h1 style="font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#2C1A0E">Asignaciones</h1><p style="font-size:13px;color:#9C8B78">Asigna vehículos y conductores a los servicios pendientes.</p></div>
      <button class="btn btn-p" @click="$store.app.toast_('Asignación creada')"><span class="material-symbols-outlined" style="font-size:16px">add</span>Nueva asignación</button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="card" style="padding:22px">
        <h3 style="font-size:14px;font-weight:700;color:#2C1A0E;margin-bottom:16px">Asignación rápida</h3>
        <div style="margin-bottom:14px"><label class="lbl">Servicio a asignar</label><select class="inp sel"><option>SRV-2026-00850 — Bogotá→Medellín</option><option>SRV-2026-00845 — Cali→Barranquilla</option></select></div>
        <div style="margin-bottom:14px"><label class="lbl">Vehículo disponible</label><select class="inp sel"><option>Ford F-350 · ABC-123 · 2.5 ton</option><option>Kenworth T680 · XYZ-456 · 5 ton</option></select></div>
        <div style="margin-bottom:18px"><label class="lbl">Conductor</label><select class="inp sel"><option>Carlos Mendoza · Disponible</option><option>Pedro Ruiz · Disponible</option></select></div>
        <button class="btn btn-p" style="width:100%;justify-content:center" @click="$store.app.toast_('Asignación guardada y conductor notificado')"><span class="material-symbols-outlined" style="font-size:16px">assignment_ind</span>Asignar ahora</button>
      </div>
      <div class="card" style="padding:22px">
        <h3 style="font-size:14px;font-weight:700;color:#2C1A0E;margin-bottom:14px">Pendientes de asignar</h3>
        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="background:#F8F4EE;border-radius:10px;padding:14px;border:1px solid #EDE5D8">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
              <div><p style="font-size:13px;font-weight:600;color:#2C1A0E">SRV-2026-00850</p><p style="font-size:11px;color:#9C8B78">Bogotá → Medellín · Residencial</p></div>
              <span class="badge b-ocre">Pendiente</span>
            </div>
            <div style="display:flex;gap:8px"><button class="btn btn-p" style="font-size:12px;padding:6px 14px" @click="$store.app.toast_('SRV-2026-00850 validado')">Validar</button><button class="btn btn-d" style="font-size:12px;padding:6px 14px" @click="$store.app.toast_('SRV-2026-00850 rechazado')">Rechazar</button></div>
          </div>
          <div style="background:#F8F4EE;border-radius:10px;padding:14px;border:1px solid #EDE5D8">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
              <div><p style="font-size:13px;font-weight:600;color:#2C1A0E">SRV-2026-00845</p><p style="font-size:11px;color:#9C8B78">Cali → Barranquilla · Comercial</p></div>

            <div style="display:flex;gap:8px"><button class="btn btn-p" style="font-size:12px;padding:6px 14px" @click="$store.app.toast_('SRV-2026-00845 validado')">Validar</button><button class="btn btn-d" style="font-size:12px;padding:6px 14px" @click="$store.app.toast_('SRV-2026-00845 rechazado')">Rechazar</button></div>
          </div>
        </div>
      </div>
